name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install flet CLI
        run: pip install flet==0.86.5

      # flet build 自动安装所需版本的 Flutter SDK / JDK / Android SDK（--yes）
      - name: Build APK
        run: flet build apk --yes --verbose

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: FletDemo-apk
          path: build/**/*.apk
          if-no-files-found: error
