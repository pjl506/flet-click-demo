[project]
name = "flet-click-demo"
version = "2.1.0"
description = "Flet 通知示例：Android 系统级通知（flet-android-notifications）+ 浏览器 SnackBar 回退"
dependencies = ["flet==0.86.5", "websocket-client>=1.6.0", "certifi", "flet-android-notifications==0.10.1"]

[tool.flet]
org = "com.example"
product = "FletDemo"

[tool.flet.app]
path = "app"
module = "notiflydeam"

[tool.flet.android.permission]
"android.permission.POST_NOTIFICATIONS" = true
